<div class="main">
    <app-side-bar></app-side-bar>
    <div class="margem">
        <header>
            <h1>Pagamentos processados</h1>
            <hr/>
            <div class="descricao">
                <span>Identificador</span>
                <span>Responsável pelo pagamento</span>
                <span class="text-right">Valor</span>
                <span class="text-right">Data do Pagamento</span>
            </div>
            <hr/>
        </header>

        <div *ngIf="isLoading" class="loading-container">
            <div class="spinner"></div>
            <p>Carregando pagamentos...</p>
        </div>
        <div *ngIf="!isLoading && pagamentos.length === 0">
                <p>Nenhum pagamento localizado ainda.</p>
        </div>
        <div *ngIf="!isLoading">
            <div *ngFor="let pagamento of pagamentos; trackBy: trackByPagamentoId">
                    <app-registro-pagamento [pagamento]="pagamento">
                    </app-registro-pagamento>
            </div>
        </div>
    </div>
</div>
