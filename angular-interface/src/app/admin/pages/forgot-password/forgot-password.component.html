<section class="admin-bg">
    <img id="bg" src="admin-bg2.png"/>
    <div class="login-form">
        <div class="img-bg">
            <img src="admin-container2.png" id="bg-container"/>
        </div>
        <form class="form" (ngSubmit)="onSubmit()">
            <h1>Recuperar Senha</h1>

            <!-- Mensagem de feedback -->
            <div *ngIf="message" class="alert" [ngClass]="{'error-alert': isError, 'success-alert': !isError}">
                <mat-icon>{{ isError ? 'error' : 'check_circle' }}</mat-icon>
                <span>{{ message }}</span>
            </div>

            <p class="texto">Informe seu e-mail cadastrado para receber o link de redefinição.</p>

            <p class="texto-label">E-mail</p>
            <mat-form-field appearance="fill" id="usuario" class="input-box">
                <input
                    matInput
                    type="email"
                    [(ngModel)]="email"
                    name="email"
                    required
                    autocomplete="email"
                >
                <mat-icon matPrefix>email</mat-icon>
            </mat-form-field>

            <button
                id="entrar-btn"
                mat-raised-button
                type="submit"
                [disabled]="!email || isLoading"
            >
                {{ isLoading ? 'Enviando...' : 'Enviar Email' }}
            </button>

            <div class="back-link">
                <a routerLink="/admin-panel">Voltar para Login</a>
            </div>
        </form>
    </div>
</section>
