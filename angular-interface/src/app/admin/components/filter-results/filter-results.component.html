<section class="filter-bar">
  <div class="filter-content">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Responsável</mat-label>
      <input matInput [(ngModel)]="nome" (input)="emitirFiltro()" placeholder="Nome do responsável">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="date-field">
      <mat-label>Data</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="data" (dateChange)="emitirFiltro()">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <button mat-button color="warn" (click)="limparFiltro()" *ngIf="nome || data">
      <mat-icon>close</mat-icon>
      Limpar
    </button>
  </div>
</section>
