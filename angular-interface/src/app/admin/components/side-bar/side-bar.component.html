<mat-toolbar class="container">
    <header>
        <img src="Logo-2.png" alt="Logo" id="adm-logo"/>
        <hr class="line">       
    </header>
    <div class="main-content">
            <button class="sidebar-btn" routerLink="/admin-panel/relatorios">
                <span>Relatórios</span>
            </button>
            <button class="sidebar-btn" routerLink="/admin-panel/reservas">
                <span>Reservas</span>
            </button>
            <button class="sidebar-btn" routerLink="/admin-panel/pacotes">
                <span>Pacotes</span>
            </button>
            <button class="sidebar-btn" routerLink="/admin-panel/pagamentos">
                <span>Pagamentos processados</span>
            </button>
        </div>
    <footer class="sidebar-footer">
        <button class="logout-btn" (click)="logout()" mat-button>
            <mat-icon>logout</mat-icon>
            <span>Sair</span>
        </button>
    </footer>
</mat-toolbar>
